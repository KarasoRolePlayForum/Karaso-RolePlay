<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARASO | بازیابی رمز عبور</title><link rel="stylesheet" href="./style.css"></head>
<body class="reset-page"><main class="reset-card"><small>KARASO ROLEPLAY / ACCOUNT SECURITY</small><h1>تعیین رمز عبور جدید</h1><p>پس از باز کردن لینک بازیابی که به ایمیلت ارسال شده، رمز جدیدت را وارد کن.</p><form id="resetForm"><label>رمز عبور جدید<input type="password" id="newPassword" minlength="6" autocomplete="new-password" required></label><label>تکرار رمز عبور<input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required></label><button class="cta full" type="submit" id="savePassword">ثبت رمز جدید</button><p id="resetMessage" class="form-error"></p></form><a class="secondary full reset-back" href="./index.html">بازگشت به صفحه اصلی</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=window.supabase.createClient(window.KARASO_SUPABASE_URL,window.KARASO_SUPABASE_PUBLISHABLE_KEY,window.KARASO_SUPABASE_AUTH_OPTIONS);
const form=document.getElementById('resetForm'),msg=document.getElementById('resetMessage'),btn=document.getElementById('savePassword');
let recoveryReady=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
function showMessage(text,isError=false){msg.textContent=text;msg.style.color=isError?'#fca5a5':'#86efac';msg.setAttribute('role','status')}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveryReady=true;btn.disabled=false;showMessage('لینک بازیابی معتبر است؛ رمز جدیدت را وارد کن.')} if(session&&new URLSearchParams(location.hash.slice(1)).get('type')==='recovery')recoveryReady=true});
(async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){showMessage('لینک بازیابی معتبر نیست یا منقضی شده است. از صفحه ورود دوباره درخواست فراموشی رمز بده.',true);btn.disabled=true;return}if(!recoveryReady){showMessage('نشست دریافت شد؛ در حال تأیید لینک بازیابی… اگر پیام تغییر رمز ظاهر نشد، لینک جدیدی درخواست کن.');return}showMessage('لینک بازیابی معتبر است؛ رمز جدیدت را وارد کن.')}catch(error){showMessage('خطا در بررسی لینک: '+error.message,true);btn.disabled=true}})();
form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<6){showMessage('رمز عبور باید حداقل ۶ کاراکتر باشد.',true);return}if(a!==b){showMessage('تکرار رمز عبور با رمز جدید یکسان نیست.',true);return}if(!recoveryReady){showMessage('ابتدا باید لینک معتبر بازیابی را از ایمیل باز کنی.',true);return}btn.disabled=true;showMessage('در حال ذخیره رمز جدید…');try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;showMessage('رمز عبور با موفقیت تغییر کرد. حالا به صفحه ورود برگرد و با رمز جدید وارد شو.');form.reset();}catch(error){showMessage('تغییر رمز انجام نشد: '+error.message+'؛ ممکن است لینک منقضی شده باشد. دوباره درخواست بازیابی بده.',true)}finally{btn.disabled=false}};
</script></body></html>
