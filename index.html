<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>KARASO STAFF | مدیریت تیم</title><link rel="stylesheet" href="./css/style.css"></head><body>
<div id="authView" class="auth-shell"><div class="auth-card"><div class="brand-mark">K</div><div class="eyebrow">KARASO ROLEPLAY • STAFF SYSTEM</div><h1 id="authHeading">ورود به پنل کارکنان</h1><p class="muted">سامانه مدیریت، نظم و عملکرد تیم</p><form id="authForm"><label id="signupNameLabel" class="hidden">نام کاربری<input id="signupDisplayName" type="text" autocomplete="nickname" placeholder="نام کاربری"></label><label id="signupGameLabel" class="hidden">نام بازی (اجباری)<input id="signupGameName" type="text" autocomplete="off" placeholder="نام شما در بازی"></label><label>ایمیل<input id="authEmail" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>رمز عبور<input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="رمز عبور"></label><button class="btn primary wide" id="authSubmit">ورود</button></form><div class="auth-links"><button class="link-btn" id="toggleSignup">ثبت‌نام حساب</button><button class="link-btn" id="forgotPassword">فراموشی رمز عبور</button></div><p class="notice">ساخت حساب به‌تنهایی مجوز عضویت در STAFF ایجاد نمی‌کند. Owner باید حساب را فعال کند.</p><div id="authMessage" class="message"></div></div></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="brand-row"><div class="brand-mark small">K</div><div><b>KARASO STAFF</b><small>OFFICIAL TEAM PANEL</small></div></div><div class="profile-mini"><div class="avatar" id="avatar">K</div><div><b id="userDisplay">کاربر</b><small id="userRank">STAFF</small></div></div><nav id="nav"><button class="nav-item active" data-page="dashboard">▦ <span>داشبورد</span></button><button class="nav-item" data-page="directory">♙ <span>لیست ادمین‌ها</span></button><button class="nav-item" data-page="timeplay">◷ <span>تایم‌پلی</span></button><button class="nav-item" data-page="reports">▤ <span>ریپورت‌ها</span></button><button class="nav-item" data-page="tasks">✓ <span>وظایف</span></button><button class="nav-item" data-page="attendance">◉ <span>حضور و غیاب / مرخصی</span></button><button class="nav-item" data-page="warnings">⚠ <span>وارن‌ها</span></button><button class="nav-item" data-page="feedback">✎ <span>انتقاد و پیشنهاد</span></button><button class="nav-item" data-page="awards">♛ <span>برترین ادمین‌ها</span></button><button class="nav-item owner-only" data-page="owner">⚙ <span>پنل Owner</span></button></nav><button class="nav-item logout" id="logoutBtn">↪ <span>خروج از حساب</span></button></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">KARASO STAFF MANAGEMENT</div><h1 id="pageTitle">داشبورد</h1></div><div class="top-user"><span class="online-dot"></span><span id="topUser">—</span></div></header><div id="pageContent" class="content"></div><footer>BUILT FOR THE BOLD <span>KARASO ROLEPLAY</span></footer></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./js/app.js"></script></body></html>
